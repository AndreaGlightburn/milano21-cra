name: Render mappe stampa
on:
  workflow_dispatch:
  push:
    paths: ['maps/render.html','maps/render.py','.github/workflows/render-maps.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python maps/render.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add maps/img
          git commit -m "Mappe renderizzate per stampa" || echo "nessuna modifica"
          git pull --rebase && git push
